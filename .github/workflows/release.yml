# Builds and publishes TeamCraft:
#
# * a tag `v<version>` (e.g. `v0.2.0`) → GitHub Release with the server
#   binaries (Linux x86_64/aarch64, Windows x64), the desktop installers
#   (Linux deb/rpm/AppImage and Flatpak bundles, macOS dmg/app, Windows x64
#   and arm64 msi/setup.exe plus portable zips), the desktop installers
#   *with local server* (Windows x64 setup.exe, macOS dmg, Linux x86_64
#   AppImage: app + server + PostgreSQL, job local-server) and
#   SHA256SUMS.txt; 0.x versions and
#   versions with a suffix (`v1.0.0-rc.1`) are marked as pre-release;
# * main every night (when it changed since the last good build: code, not
#   only *.md/docs/platforms), "Run workflow", or a pull request that changes
#   this file or the packaging → the same files as workflow artifacts (kept
#   14 days), no release.
#
# A push to main does not run this workflow. It used to, with a newer push
# cancelling the running build: on a day with several merges about half of
# the commits on main carried a red ✗ from cancelled release jobs, which hid
# real failures (#275). A nightly build is never cancelled, needs one run per
# day instead of one per merge, and a failure in it is a real one.
#
# Container image ghcr.io/rudalabs/teamcraft (Dockerfile, built natively on
# an amd64 and an arm64 runner, merged into one multi-platform image):
# * main (nightly or "Run workflow" on main) → :edge;
# * tag v<version> → :<version> and :<major>.<minor>, plus :latest for every
#   version without a suffix – also 0.x, although its GitHub Release is a
#   pre-release, so that deploy/install.sh has a "newest release" before 1.0;
# * pull request that changes the Dockerfile or deploy/ → build only, no push;
# * every image build is followed by a smoke test of the whole Docker install
#   (deploy/install.sh with the freshly built image, loaded in the runner).
# Images are never built on a developer machine for this project.
#
# The tag must match the version in Cargo.toml, desktop/Cargo.toml and
# desktop/tauri.conf.json. Installers are not code-signed yet (see
# CONTRIBUTING.md, "Releases").
name: Release

on:
  push:
    tags: ["v*"]
  # main, nightly; skipped when nothing but documentation changed since the
  # last successful build (see the version job)
  schedule:
    - cron: "7 1 * * *"
  # A change of the release pipeline or the packaging builds everything once;
  # a change of the Docker files builds and tests the image only.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "desktop/tauri.conf.json"
      - "desktop/tauri.local-server.conf.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

# Runs of one ref queue up: a nightly build, a tag or "Run workflow" is never
# cancelled (a cancelled run shows as a red ✗ on its commit), and two :edge
# builds never finish in the wrong order. Only a newer push to a pull request
# replaces its running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE: ghcr.io/rudalabs/teamcraft
  # docker/metadata-action tags (see the header).
  IMAGE_TAGS: |
    type=edge,branch=main
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

jobs:
  version:
    name: version check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # the nightly run looks up the last successful build
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      artifacts: ${{ steps.changes.outputs.artifacts }}
      image: ${{ steps.changes.outputs.image }}
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Pull requests build only what they change: binaries and installers for
      # a change of this file or the packaging, the image for a change of the
      # Docker files. The nightly run builds nothing when main has no change
      # outside the documentation since the last successful build of main.
      - id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=true image=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "$changed"
            grep -qE '^(\.github/workflows/release\.yml|packaging/|desktop/tauri\.(conf|local-server\.conf)\.json)' <<<"$changed" || artifacts=false
            grep -qE '^(Dockerfile|\.dockerignore|deploy/|\.github/workflows/release\.yml)' <<<"$changed" || image=false
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            last=$(gh run list --workflow release.yml --branch main --status success --limit 20 \
              --json headSha,event --jq '[.[] | select(.event != "pull_request")][0].headSha // ""') || last=""
            if [ -n "$last" ] && git fetch --quiet --no-tags --depth=1 origin "$last"; then
              code=$(git diff --name-only "$last" HEAD | grep -vE '\.md$|^docs/|^platforms/' || true)
              if [ -z "$code" ]; then
                echo "::notice::main has no code change since the last successful build ($last): nothing to build"
                artifacts=false image=false
              fi
            fi
          fi
          # :edge from main (nightly or "Run workflow"), versions from tags;
          # never from pull requests, forks or other branches
          publish=false
          if [ "$GITHUB_REPOSITORY" = "rudalabs/TeamCraft" ]; then
            case "$GITHUB_EVENT_NAME/$GITHUB_REF" in
              push/refs/tags/v*|schedule/refs/heads/main|workflow_dispatch/refs/heads/main) publish=true ;;
            esac
          fi
          echo "artifacts=$artifacts image=$image publish=$publish"
          {
            echo "artifacts=$artifacts"
            echo "image=$image"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          server=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          desktop=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -1)
          tauri=$(jq -r .version desktop/tauri.conf.json)
          echo "server $server, desktop $desktop, tauri.conf.json $tauri"
          if [ "$server" != "$desktop" ] || [ "$server" != "$tauri" ]; then
            echo "::error::the three version fields differ"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "${GITHUB_REF_NAME#v}" != "$server" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $server"; exit 1
          fi
          pre=false
          if [[ "$server" == 0.* || "$server" == *-* ]]; then pre=true; fi
          echo "version=$server" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  server:
    name: server (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.artifacts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="teamcraft-${{ needs.version.outputs.version }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/teamcraft.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp target/release/teamcraft "dist/$name/"
            if [ "$RUNNER_OS" = "Linux" ]; then
              cp -r packaging/linux "dist/$name/packaging"
            fi
            # The repository stores most files with the executable bit; the
            # archive gets explicit modes: only the binary is executable.
            find "dist/$name" -type d -exec chmod 755 {} +
            find "dist/$name" -type f -exec chmod 644 {} +
            chmod 755 "dist/$name/teamcraft"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            tar -tvzf "dist/$name.tar.gz"
          fi
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.artifacts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bundles: "deb,rpm,appimage" }
          - { os: ubuntu-24.04-arm, bundles: "deb,rpm" }
          - { os: macos-latest, bundles: "app,dmg" }
          - { os: windows-latest, bundles: "msi,nsis", arch: x64 }
          - { os: windows-11-arm, bundles: "msi,nsis", arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: release-bundle
      - name: Tauri CLI
        shell: bash
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Build the installers
        working-directory: desktop
        shell: bash
        # Bundling is off in tauri.conf.json so that local builds stay fast.
        run: cargo tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"active":true}}'
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          b=desktop/target/release/bundle
          find "$b" -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist/ \;
          # The macOS .app is a folder: ship it zipped next to the .dmg.
          if [ -d "$b/macos" ]; then
            for app in "$b"/macos/*.app; do
              ditto -c -k --keepParent "$app" "dist/$(basename "$app" .app)_${{ needs.version.outputs.version }}_aarch64.app.zip"
            done
          fi
          ls -l dist
      # Windows: the same executable without an installer. `cargo tauri build`
      # compiles it with the custom-protocol feature, so the user interface is
      # embedded; it needs the WebView2 runtime, which Windows 10 and 11 have.
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "TeamCraft_${{ needs.version.outputs.version }}_${{ matrix.arch }}_portable"
          $dir = "dist-portable\$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item desktop\target\release\teamcraft-desktop.exe "$dir\TeamCraft.exe"
          Copy-Item LICENSE "$dir\LICENSE.txt"
          @(
            "TeamCraft Desktop ${{ needs.version.outputs.version }} (${{ matrix.arch }}) - portable",
            "",
            "Unpack the folder anywhere and start TeamCraft.exe; nothing is installed.",
            "The app needs the Microsoft Edge WebView2 runtime, which is part of",
            "Windows 10 and 11. If it is missing, install it from",
            "https://developer.microsoft.com/microsoft-edge/webview2/",
            "",
            "Settings are stored in your user profile like with the installers.",
            "Source code and documentation: https://github.com/rudalabs/TeamCraft",
            "Licensed under the Mozilla Public License 2.0 (LICENSE.txt)."
          ) | Set-Content -Encoding utf8 "$dir\README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  # TeamCraft Desktop as a single-file Flatpak bundle from
  # packaging/flatpak/io.github.rudalabs.teamcraft.yml (GNOME 49 runtime,
  # installed from Flathub on the user's machine). Built natively on an x86_64
  # and an aarch64 runner in the Flathub build container.
  flatpak:
    name: flatpak (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.artifacts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      # /var/lib/flatpak as a volume (Docker copies the image's runtimes into
      # it): when Flathub has a newer GNOME SDK than the image, flatpak renames
      # the old deployment, which overlayfs refuses for directories of the
      # image ("Invalid cross-device link", then a crash – PR #295).
      options: --privileged --volume /var/lib/flatpak
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    env:
      BUNDLE: TeamCraft_${{ needs.version.outputs.version }}_${{ matrix.arch }}.flatpak
    steps:
      - uses: actions/checkout@v4
      # v6.8; the action moved back from flathub-infra to flatpak, the build
      # image stays at ghcr.io/flathub-infra.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: packaging/flatpak/io.github.rudalabs.teamcraft.yml
          bundle: ${{ env.BUNDLE }}
          arch: ${{ matrix.arch }}
          cache-key: release-flatpak
          upload-artifact: false
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mv "$BUNDLE" dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-flatpak-${{ matrix.arch }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  # TeamCraft Desktop *with local server*: the desktop installer plus the
  # server binary (as `teamcraft-server`, a Tauri externalBin – `teamcraft`
  # would clash with the app's own `TeamCraft` executable on the
  # case-insensitive file systems of Windows and macOS) and PostgreSQL's
  # programs (resources `postgresql/`). One download to try TeamCraft on a
  # laptop: *Try TeamCraft on this computer* runs `teamcraft-server local`
  # (src/localserver.rs, desktop/src/localserver.rs). Only for the platforms
  # most testers have; the regular installers stay small.
  #
  # PostgreSQL: the relocatable builds of theseus-rs/postgresql-binaries
  # (PostgreSQL licence), the newest patch release of PG_MAJOR, checked
  # against the release's .sha256 file; the licence text comes from the
  # PostgreSQL sources of the same version.
  local-server:
    name: desktop with local server (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.artifacts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: appimage }
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
    env:
      PG_MAJOR: "18"
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
          key: release-local-server-${{ matrix.target }}
      - name: Tauri CLI
        shell: bash
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Server (as teamcraft-server)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p desktop/binaries
          cp "target/release/teamcraft$ext" "desktop/binaries/teamcraft-server-${{ matrix.target }}$ext"
          ls -l desktop/binaries
      - name: PostgreSQL ${{ env.PG_MAJOR }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Relative paths only: Git Bash on Windows mistakes `D:\…` for a host.
        run: |
          set -euo pipefail
          repo=theseus-rs/postgresql-binaries
          version=$(gh release list --repo "$repo" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E "^${PG_MAJOR}\.[0-9]+\.[0-9]+$" | sort -t. -k2,2n -k3,3n | tail -1)
          if [ -z "$version" ]; then echo "::error::no PostgreSQL ${PG_MAJOR}.x release in $repo"; exit 1; fi
          echo "PostgreSQL $version"
          asset="postgresql-$version-${{ matrix.target }}.tar.gz"
          mkdir -p .pg-download
          gh release download "$version" --repo "$repo" --dir .pg-download --pattern "$asset" --pattern "$asset.sha256"
          cd .pg-download
          expected=$(awk '{print $1}' "$asset.sha256")
          if command -v sha256sum > /dev/null; then
            actual=$(sha256sum "$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$asset" | awk '{print $1}')
          fi
          echo "sha256 expected $expected, got $actual"
          test -n "$expected" && test "$expected" = "$actual"
          tar -xzf "$asset"
          cd ..
          initdb=$(find .pg-download -type f \( -name initdb -o -name initdb.exe \) -path '*/bin/*' -print -quit)
          root=$(dirname "$(dirname "$initdb")")
          dest=desktop/local-server/postgresql
          mkdir -p "$dest"
          for dir in bin lib share; do
            if [ -d "$root/$dir" ]; then cp -RL "$root/$dir" "$dest/"; fi
          done
          # what a running server does not need
          rm -rf "$dest/share/doc" "$dest/share/man" "$dest/lib/pgxs" "$dest"/pgAdmin* "$dest"/StackBuilder*
          find "$dest" -type f \( -name '*.a' -o -name '*.pdb' -o -name '*.lib' \) -delete
          # Only the programs `teamcraft local` runs (initdb, pg_ctl, postgres)
          # and the client tools for a manual backup – not the ~35 other tools,
          # PostgreSQL's test program or the Python interpreter of PL/Python
          # that the Windows build brings (python.exe, Lib/, DLLs/): an
          # unsigned installer with an embedded Python was reported as a virus
          # by a browser. Libraries stay, except Python's.
          keep=" initdb pg_ctl postgres psql pg_dump pg_restore pg_isready "
          rm -rf "$dest/bin/DLLs" "$dest/bin/Lib"
          for f in "$dest"/bin/*; do
            name=$(basename "$f")
            case "$name" in
              python*) rm -rf "$f" ;;
              *.dll) ;;
              *) if [[ "$keep" != *" ${name%.exe} "* ]]; then rm -rf "$f"; fi ;;
            esac
          done
          find "$dest" -depth -iname '*plpython*' -exec rm -rf {} +
          # what must be left: the three programs, pg_trgm (migrations), no Python
          for p in initdb pg_ctl postgres; do
            test -f "$dest/bin/$p" || test -f "$dest/bin/$p.exe"
          done
          test -f "$dest/share/extension/pg_trgm.control"
          test -z "$(find "$dest" -iname 'python*')"
          # the licence of the PostgreSQL version shipped
          IFS=. read -r major minor _ <<< "$version"
          curl -fsSL "https://raw.githubusercontent.com/postgres/postgres/REL_${major}_${minor}/COPYRIGHT" \
            -o "$dest/COPYRIGHT.txt"
          printf 'PostgreSQL %s from https://github.com/%s (%s)\n' "$version" "$repo" "$asset" > "$dest/SOURCE.txt"
          ls "$dest" "$dest/bin"
          du -sh "$dest"
      # Every Mach-O file of the bundle needs a signature on Apple silicon;
      # the app itself is signed ad hoc by Tauri (signingIdentity "-").
      - name: Sign PostgreSQL ad hoc (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          find desktop/local-server/postgresql -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then codesign --force --sign - "$f"; fi
          done
      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: cargo tauri build --bundles ${{ matrix.bundles }} --config tauri.local-server.conf.json
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          b=desktop/target/release/bundle
          find "$b" -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) \
            | while read -r f; do
                name=$(basename "$f")
                cp "$f" "dist/${name/TeamCraft_/TeamCraft-with-local-server_}"
              done
          ls -l dist
          test -n "$(ls dist)"
      # The bundled server with the bundled PostgreSQL, where the installed
      # app has them: first start, the first-start page, a clean stop when
      # standard input closes (as when the app ends).
      - name: Smoke test of the bundled server
        shell: bash
        run: |
          set -euo pipefail
          posix() { if [ "$RUNNER_OS" = "Windows" ]; then cygpath -u "$1"; else printf '%s' "$1"; fi; }
          tmp=$(posix "$RUNNER_TEMP")
          case "$RUNNER_OS" in
            Linux)
              app=$(find dist -name '*.AppImage' -print -quit)
              chmod +x "$app"
              (cd "$tmp" && "$GITHUB_WORKSPACE/$app" --appimage-extract > /dev/null)
              base="$tmp/squashfs-root" ;;
            macOS)
              base="desktop/target/release/bundle/macos/TeamCraft.app" ;;
            Windows)
              setup=$(find dist -name '*-setup.exe' -print -quit)
              "./$setup" //S
              base="$(posix "$LOCALAPPDATA")/TeamCraft" ;;
          esac
          server=$(find "$base" -type f \( -name teamcraft-server -o -name teamcraft-server.exe \) -print -quit)
          initdb=$(find "$base" -type f \( -name initdb -o -name initdb.exe \) -path '*postgresql/bin/*' -print -quit)
          echo "server: $server"; echo "initdb: $initdb"
          if [ -z "$server" ] || [ -z "$initdb" ]; then ls -R "$base" | sed -n '1,80p'; exit 1; fi
          pgbin=$(dirname "$initdb")
          test -f "$(dirname "$pgbin")/COPYRIGHT.txt"
          "$server" --version
          data="$tmp/tc-local"
          log="$tmp/local.log"
          # set +e: the test ends `sleep` on purpose, which fails the pipeline
          # under pipefail; the server's own exit status is PIPESTATUS[1]
          ( set +e; sleep 900 | "$server" local --data-dir "$data" --port 18080 --pg-bin "$pgbin" --exit-with-stdin \
              > "$log" 2>&1; echo "${PIPESTATUS[1]}" > "$tmp/local.status" ) &
          ready=""
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/readyz; then ready=1; break; fi
            sleep 1
          done
          echo
          if [ -z "$ready" ]; then cat "$log"; exit 1; fi
          curl -fsS -o "$tmp/login.html" http://127.0.0.1:18080/login
          grep -q "Create the administrator" "$tmp/login.html"
          # end the pipe's writer: the server sees the end of its standard input
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM sleep.exe; else pkill -x sleep; fi
          for _ in $(seq 1 60); do [ -s "$tmp/local.status" ] && break; sleep 1; done
          cat "$log"
          test "$(cat "$tmp/local.status")" = 0
          grep -q "PostgreSQL stopped" "$log"
          test ! -e "$data/postgres/postmaster.pid"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-local-server-${{ matrix.os }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    # After the image: install.sh installs the newest release, whose image
    # must already be on ghcr.io.
    needs: [version, server, desktop, flatpak, local-server, image-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Only the binaries and installers – not the image-digest-* artifacts.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: server-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "TeamCraft ${{ needs.version.outputs.version }}")
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"

  # ---- container image ------------------------------------------------------

  image:
    name: image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.image == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    env:
      # Published only from main (:edge) and v* tags of this repository;
      # pull requests, forks and "Run workflow" on other branches only build.
      PUSH: ${{ needs.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.IMAGE_TAGS }}
          labels: org.opencontainers.image.licenses=MPL-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version || 'dev' }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          # Pushed by digest; the manifest job below adds the tags.
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
      - name: Keep the digest
        if: env.PUSH == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  image-manifest:
    name: image manifest
    needs: [version, image, docker-smoke]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.IMAGE_TAGS }}
      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.licenses=MPL-2.0" \
            --annotation "index:org.opencontainers.image.description=TeamCraft PDM/PLM server" \
            --annotation "index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            "${sources[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # The whole Docker installation, as a user runs it: install.sh (dry run and
  # real), the compose file with PostgreSQL, /readyz, the first administrator,
  # the container health check, an upgrade run and the uninstall. The image is
  # built from the cache of the image job and loaded into this runner – nothing
  # is published here.
  docker-smoke:
    name: Docker install smoke test
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TC_DIR: /tmp/teamcraft-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        run: |
          bash -n deploy/install.sh
          shellcheck --version
          shellcheck deploy/install.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64, from the cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=image-amd64
      - name: install.sh --dry-run
        run: ./deploy/install.sh --dry-run --yes --version ci --dir "$TC_DIR"
      - name: Install
        run: ./deploy/install.sh --yes --no-pull --version ci --dir "$TC_DIR"
      - name: Check the installation
        working-directory: ${{ env.TC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/readyz; echo
          test "$(stat -c %a secrets)" = 700
          test "$(stat -c %a teamcraft.env)" = 600
          docker compose ps
          # runs as the unprivileged user of the image
          test "$(docker inspect --format '{{.Config.User}}' "$(docker compose ps -q teamcraft)")" = "65532:65532"
          printf 'smoke-test-password-%s\n' "$RANDOM$RANDOM" \
            | docker compose exec -T teamcraft teamcraft user create --username admin --role admin
          docker compose exec -T teamcraft teamcraft user list | grep '^admin '
          docker compose exec -T teamcraft teamcraft vault check
          # the login page is served
          curl -fsS -o "$RUNNER_TEMP/login.html" http://127.0.0.1:8080/login
          grep -qi '<form' "$RUNNER_TEMP/login.html"
          # the image's HEALTHCHECK (teamcraft healthcheck) reports healthy
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q teamcraft)")
            [ "$status" = healthy ] && break
            sleep 3
          done
          echo "health: $status"
          test "$status" = healthy
      - name: Upgrade run keeps the data
        run: |
          ./deploy/install.sh --yes --no-pull --version ci --dir "$TC_DIR"
          cd "$TC_DIR" && docker compose exec -T teamcraft teamcraft user list | grep '^admin '
      - name: Uninstall keeps the data, reinstall finds it
        run: |
          ./deploy/install.sh --uninstall --dir "$TC_DIR"
          ./deploy/install.sh --yes --no-pull --version ci --dir "$TC_DIR"
          cd "$TC_DIR" && docker compose exec -T teamcraft teamcraft user list | grep '^admin '
      - name: Logs
        if: always()
        working-directory: ${{ env.TC_DIR }}
        run: docker compose logs --no-color || true
      - name: Purge
        if: always()
        run: ./deploy/install.sh --uninstall --purge --yes --dir "$TC_DIR" || true
