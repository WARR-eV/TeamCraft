# TeamCraft Desktop: formatting, lints, tests and a start-up smoke test on
# Linux (x86_64, ARM64), macOS (ARM64) and Windows (x86_64, ARM64 preview),
# plus a syntax check of the user interfaces (desktop/ui, static, shared).
# Installers are not built or published.
#
# Each job runs only when a file it checks changed (scripts/ci-changes.sh,
# the one table from files to jobs): the UI job for the scripts and styles,
# the platform matrix for the app's Rust code, configuration, icons and the
# shared/ mirror – a change of desktop/ui/js alone no longer builds the app
# on six platforms. The weekly run and "Run workflow" run everything.
name: Desktop app

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks; each commit on
# main keeps its own run, so that no commit on main shows a red ✗ only
# because a later push cancelled its run (#275).
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Which jobs the change needs (scripts/ci-changes.sh): `desktop_ui` for the
  # UI job, `desktop_rust` for the platform matrix.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.c.outputs.desktop_ui }}
      rust: ${{ steps.c.outputs.desktop_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Self-test of the change table
        run: bash scripts/ci-changes.sh --self-test
      - id: c
        env:
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: bash scripts/ci-changes.sh

  ui:
    name: desktop UI (JavaScript syntax)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The runner's own Node.js is only used to parse the files – the app
      # itself has no build step and no Node.js dependency.
      - name: Parse every script of the desktop and web UI
        run: |
          set -e
          node --version
          for f in static/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
          # shared/ and desktop/ui/js/ hold ES modules: without a package.json
          # Node reads .js as CommonJS, so parse them as modules from stdin.
          find shared desktop/ui/js -name '*.js' -print | sort | while read -r f; do
            echo "node --input-type=module --check < $f"
            node --input-type=module --check < "$f"
          done
      # the desktop modules: every import resolves, every name of another
      # module that is used is imported, all reachable from js/main.js; no
      # desktop module or static/app.js re-declares a shared/js export
      - name: Check the imports of the desktop UI and shared modules
        run: node scripts/check-desktop-modules.mjs
      # the pure rules of the tab order (moving, switching, closing)
      - name: Test the tab order rules
        run: node scripts/desktop-tab-order.test.mjs
      # the pure rules of the Files view of Home (orders, labels, pages)
      - name: Test the rules of the Files view
        run: node scripts/desktop-files-view.test.mjs
      # the reviewers of the release dialog and when a draft can be submitted
      - name: Test the release rules
        run: node scripts/desktop-release-rules.test.mjs
      # the entries of the right-click menu of an item and why one is
      # disabled – the revision toolbar's rules (#417)
      - name: Test the item menu rules
        run: node scripts/desktop-item-menu.test.mjs
      # the check-out graph of a project group: the server's layout (#428)
      - name: Test the check-out graph layout
        run: node scripts/desktop-lock-layout.test.mjs
      # whether a Get left the working folder complete enough to open the
      # main CAD file (Check out and open after Cancel, #348)
      - name: Test the Get rules
        run: node scripts/desktop-get-rules.test.mjs
      # the steps of the first-start wizard *Getting started* (#422): which
      # are skipped, when it shows by itself, the texts
      - name: Test the first-start wizard rules
        run: node scripts/desktop-onboarding-rules.test.mjs
      # new items from files on this computer (#359): group and folder from
      # where the file is, the duplicate findings, the worklist suggestions
      - name: Test the rules of new items from local files
        run: node scripts/desktop-new-files.test.mjs
      # the mesh check of the shared 3D viewer: empty, cut-off or invalid
      # models end in a message, not in an empty canvas (#290)
      - name: Test the 3D viewer's mesh check
        run: node scripts/viewer-mesh.test.mjs
      # the shared rules (labels, numbers, sizes, ages, state glyphs,
      # markdown-lite) against shared/test-vectors – the same vectors
      # src/ui_vectors.rs pins the server's Rust side to
      - name: Test the shared UI rules against the test vectors
        run: node scripts/shared-vectors.test.mjs
      # the message catalogs of the translated UI (#379)
      - name: Test the translated UI catalogs
        run: node scripts/shared-i18n.test.mjs

  test:
    name: desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # ARM64 Windows runners are still a preview: report, but never block.
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: one leg per release architecture (the cfgs in
        # desktop/src; Windows ARM64 still reports only, see above). Main,
        # the weekly run and manual runs add the newer Ubuntu (WebKitGTK
        # drift).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]' || '["ubuntu-26.04", "ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # formatting does not depend on the platform
      - name: fmt
        if: matrix.os == 'ubuntu-24.04'
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: clippy, tests
        working-directory: desktop
        shell: bash
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build the app
        working-directory: desktop
        run: cargo build --locked

      # Start the real app (web view, menu, settings) with a fresh profile and
      # check it is still running after 20 seconds: catches crashes at start-up
      # that unit tests cannot see. Without a server it shows its connect page.
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          # The app's status goes through a file: xvfb-run itself sometimes
          # fails while cleaning up its temporary directory ("problem while
          # cleaning up temporary directory", exit 1) after the app ran fine.
          rm -f smoke.status
          xvfb-run -a sh -c 'WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout 20 desktop/target/debug/teamcraft-desktop > smoke.log 2>&1; echo $? > smoke.status'
          xvfb=$?
          cat smoke.log
          if [ ! -s smoke.status ]; then echo "xvfb-run failed with $xvfb before the app ran"; exit 1; fi
          status=$(cat smoke.status)
          # 124 = still running when the timeout stopped it
          if [ "$status" -ne 124 ]; then echo "the app exited early with $status"; exit 1; fi
          if grep -q "panicked" smoke.log; then echo "the app panicked"; exit 1; fi
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          desktop/target/debug/teamcraft-desktop > smoke.log 2>&1 &
          pid=$!
          sleep 20
          cat smoke.log
          if ! kill -0 "$pid" 2>/dev/null; then echo "the app exited early"; exit 1; fi
          kill "$pid"
          if grep -q "panicked" smoke.log; then echo "the app panicked"; exit 1; fi
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "desktop\target\debug\teamcraft-desktop.exe" -PassThru `
            -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Start-Sleep -Seconds 20
          Get-Content smoke.out, smoke.err -ErrorAction SilentlyContinue
          if ($p.HasExited) { Write-Error "the app exited early with $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (Select-String -Path smoke.err -Pattern "panicked" -Quiet) { Write-Error "the app panicked"; exit 1 }
