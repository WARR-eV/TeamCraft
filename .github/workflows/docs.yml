# Documentation site on GitHub Pages: the mdBook in docs/ (Doxygen-style
# theme) plus the rustdoc API reference under /api/.
# Enable it once under Settings → Pages → Source: GitHub Actions.
# The "links" job checks that every local image and link target in README.md,
# the other top-level Markdown files and the book exists
# (scripts/check-doc-links.sh), also for README-only pull requests. The book
# and the API reference are built (and on main deployed) only when their
# sources changed – docs/, src/, the Cargo files or this workflow
# (scripts/ci-changes.sh, `docs_site`); "Run workflow" always builds.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*.md"
      - "platforms/**"
      - "desktop/README.md"
      - "media/**"
      - "LICENSE"
      - "scripts/**" # link targets in the README, and the check itself
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "platforms/**"
      - "desktop/README.md"
      - "media/**"
      - "LICENSE"
      - "scripts/**" # link targets in the README, and the check itself
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; pull requests get their own group so that a
# pending run of one pull request never replaces the pending run of another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  # superseded pull request runs are cancelled; a Pages deploy never is
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.5.4"

jobs:
  links:
    name: local links and images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that every local link and image target exists
        run: scripts/check-doc-links.sh

  # Whether the site's sources changed (scripts/ci-changes.sh, `docs_site`):
  # a README, media or scripts change only needs the links check.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.c.outputs.docs_site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Self-test of the change table
        run: bash scripts/ci-changes.sh --self-test
      - id: c
        env:
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: bash scripts/ci-changes.sh

  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - name: Build the book
        # absolute path: relative --dest-dir values are resolved differently
        # by mdBook versions
        run: mdbook build docs --dest-dir "$GITHUB_WORKSPACE/site"
      - name: Build the Rust API reference
        run: |
          cargo doc --locked --no-deps --lib
          mkdir -p site/api
          cp -r target/doc/. site/api/
      - name: Check the site
        run: |
          ls site
          test -f site/index.html
          test -f site/guide/getting-started.html
          test -f site/api/teamcraft/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
